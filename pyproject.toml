[project]
name = "obsidian-dangerous"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "dotenv>=0.9.9",
  "fastapi",
  "pwdlib[argon2]>=0.3.1",
  "pydantic-settings>=2.15.0",
  "pydantic[email]>=2.13.5",
  "pyjwt>=2.15.1",
  "python-multipart>=0.0.32",
  "pyzmq>=27.2.0",
  "sqlalchemy[asyncio]>=2.1.3",
  "uvicorn[standar,standard]",
]
[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio>=1.4.0",
  "ruff",
]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.format]
quote-style = "double"
