[project]
name = "obsidian-dangerous"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "pydantic-settings>=2.15.0",
  "pyzmq>=27.2.0",
  "uvicorn[standar]",
]
[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
